[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltc"
dynamic = ["version"]
requires-python = ">=3.12, <4"

description = "Learning to communicate"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["machine-learning", "reinforcement-learning", "jax", "wireless-communication", "multi-agent-systems"]

authors = [
  {name = "Maksymilian Wojnar", email = "maksymilian.wojnar@agh.edu.pl"},
  {name = "Kamil Szczęch", email = "kamil.szczech@agh.edu.pl"},
  {name = "Krzysztof Rusek", email = "krzysztof.rusek@agh.edu.pl"},
  {name = "Katarzyna Kosek-Szott", email = "katarzyna.kosek-szott@agh.edu.pl"},
  {name = "Szymon Szott", email = "szymon.szott@agh.edu.pl"}
]

dependencies = [
    "reinforced-lib~=2.0.4",
    "tqdm~=4.67.1",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12-local]",
]
symbolic = [
    "pysr~=2.0.0",
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0",
    "seaborn>=0.13.2",
    "marimo>=0.23.5",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
]
analysis = [
    "SALib~=1.5.2",
]

[tool.setuptools]
packages = ["ltc"]

[tool.setuptools.dynamic.version]
attr = "ltc.__version__"
